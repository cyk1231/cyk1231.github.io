name: Sync Repos

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-repos.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos & pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 - <<'PYEOF'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json", "User-Agent": "cyk1231"}

          # Fetch all public repos
          repos = []
          page = 1
          while True:
              url = f"https://api.github.com/users/cyk1231/repos?sort=updated&per_page=100&page={page}&type=public"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              if not data:
                  break
              repos.extend(data)
              page += 1

          # Fetch pinned repos via GraphQL
          gql = """{ user(login: "cyk1231") { pinnedItems(first: 10) { nodes { ... on Repository { name } } } } }"""
          gql_req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": gql}).encode(),
              headers={**headers, "Content-Type": "application/json"},
          )
          pinned = []
          try:
              with urllib.request.urlopen(gql_req) as resp:
                  pinned = [n["name"] for n in json.load(resp)["data"]["user"]["pinnedItems"]["nodes"]]
          except Exception as e:
              print(f"Pinned fetch failed: {e}")

          # Slim down repo data
          slim = [{
              "name": r["name"],
              "description": r["description"],
              "language": r["language"],
              "stargazers_count": r["stargazers_count"],
              "html_url": r["html_url"],
              "updated_at": r["updated_at"],
              "fork": r["fork"],
              "archived": r["archived"],
              "topics": r.get("topics", []),
              "homepage": r.get("homepage"),
          } for r in repos]

          output = {
              "generated_at": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "pinned": pinned,
              "repos": slim,
          }

          with open("repos.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Synced {len(slim)} repos, {len(pinned)} pinned")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync repos.json"
            git push
          fi
