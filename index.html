<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陈益凯 · Cards</title>
  <style>
    :root {
      --bg: #fafafa;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --text-tertiary: #999;
      --border: #e8e8e8;
      --accent: #4a90d9;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.10);
      --radius: 12px;
      --max-width: 680px;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #e6edf3;
      --text-secondary: #9198a1;
      --text-tertiary: #6e7681;
      --border: #30363d;
      --accent: #58a6ff;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
    }

    /* Header */
    header {
      text-align: center;
      padding: 4rem 1.5rem 2.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header .tagline {
      margin-top: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    header .links {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
    }

    header .links a {
      color: var(--text-tertiary);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    header .links a:hover { color: var(--accent); }

    /* Controls */
    .controls {
      max-width: var(--max-width);
      margin: 0 auto 1.5rem;
      padding: 0 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .controls input {
      flex: 1;
      min-width: 200px;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .controls input:focus { border-color: var(--accent); }

    .controls select {
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Card grid */
    .cards {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      transition: box-shadow 0.25s, transform 0.25s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-pin {
      font-size: 0.7rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      white-space: nowrap;
    }

    .card-desc {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-tertiary);
      flex-wrap: wrap;
    }

    .lang-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .card-meta .fork-badge {
      color: var(--text-tertiary);
      font-size: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
    }

    .card-topics {
      margin-top: 0.6rem;
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .topic-tag {
      font-size: 0.72rem;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-tertiary);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Empty / loading states */
    .loading, .empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-tertiary);
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, opacity 0.3s;
      z-index: 100;
      color: var(--text);
    }

    .theme-toggle:hover { border-color: var(--accent); }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 2.5rem 1.5rem 2rem; }
      header h1 { font-size: 1.4rem; }
      .cards { padding: 0 1rem 3rem; }
      .card { padding: 1.2rem; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>

  <header>
    <h1>陈益凯</h1>
    <p class="tagline">USTC Physics · Nuclear Tech · AI Builder</p>
    <div class="links">
      <a href="https://github.com/cyk1231" target="_blank">GitHub</a>
      <a href="#" id="aboutLink">关于</a>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="搜索仓库…">
    <select id="sortSelect">
      <option value="updated">最近更新</option>
      <option value="stars">最多 Star</option>
      <option value="name">名称</option>
    </select>
  </div>

  <div class="cards" id="cardsContainer">
    <div class="loading"><span class="spinner"></span></div>
  </div>

  <footer>
    <p>© <span id="year"></span> 陈益凯 · Powered by <a href="https://pages.github.com" target="_blank">GitHub Pages</a></p>
  </footer>

  <script>
    // ── Language colors (GitHub linguist subset) ──
    const LANG_COLORS = {
      'Python': '#3572A5', 'Jupyter Notebook': '#DA5B0B', 'C++': '#f34b7d',
      'C': '#555555', 'JavaScript': '#f1e05a', 'TypeScript': '#3178c6',
      'HTML': '#e34c26', 'CSS': '#563d7c', 'Shell': '#89e051',
      'Rust': '#dea584', 'Go': '#00ADD8', 'Java': '#b07219',
      'C#': '#178600', 'Vue': '#41b883', 'Dart': '#00B4AB',
      'Kotlin': '#A97BFF', 'Swift': '#F05138', 'Ruby': '#701516',
      'Lua': '#000080', 'MATLAB': '#e16737', 'Dockerfile': '#384d54',
    };

    // ── Theme ──
    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      themeToggle.textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(!isDark);
    });

    document.getElementById('year').textContent = new Date().getFullYear();

    // ── Pinned repos (auto-synced by GitHub Actions) ──
    let pinnedNames = [];
    let allRepos = [];
    let displayRepos = [];

    // ── Fetch repos ──
    async function fetchRepos() {
      // Try static cache first (generated by Actions), fallback to live API
      try {
        const res = await fetch('repos.json');
        if (res.ok) {
          const data = await res.json();
          pinnedNames = data.pinned || [];
          return data.repos;
        }
      } catch (e) {}

      // Fallback: live unauthenticated API (60 req/h limit)
      const res = await fetch('https://api.github.com/users/cyk1231/repos?sort=updated&per_page=100&type=public');
      const repos = await res.json();
      return repos.filter(r => !r.fork || true); // keep forks, just sort lower
    }

    // ── Render ──
    function renderCards() {
      const container = document.getElementById('cardsContainer');
      const query = document.getElementById('searchInput').value.toLowerCase();
      const sortBy = document.getElementById('sortSelect').value;

      let list = displayRepos.filter(r =>
        r.name.toLowerCase().includes(query) ||
        (r.description || '').toLowerCase().includes(query)
      );

      // Sort
      if (sortBy === 'stars') {
        list.sort((a, b) => b.stargazers_count - a.stargazers_count);
      } else if (sortBy === 'name') {
        list.sort((a, b) => a.name.localeCompare(b.name));
      } else {
        list.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      }

      // Pinned first
      list.sort((a, b) => {
        const aPin = pinnedNames.includes(a.name) ? 0 : 1;
        const bPin = pinnedNames.includes(b.name) ? 0 : 1;
        return aPin - bPin;
      });

      if (list.length === 0) {
        container.innerHTML = '<div class="empty">没有匹配的仓库</div>';
        return;
      }

      container.innerHTML = list.map(r => {
        const isPinned = pinnedNames.includes(r.name);
        const lang = r.language;
        const langColor = lang ? (LANG_COLORS[lang] || '#ccc') : null;
        const updated = new Date(r.updated_at);
        const now = new Date();
        const diffDays = Math.floor((now - updated) / 86400000);
        const updatedStr = diffDays === 0 ? '今天' :
          diffDays < 30 ? `${diffDays} 天前` :
          diffDays < 365 ? `${Math.floor(diffDays / 30)} 个月前` :
          `${Math.floor(diffDays / 365)} 年前`;

        const topics = (r.topics || []).slice(0, 4).map(t =>
          `<span class="topic-tag">${t}</span>`
        ).join('');

        return `
          <a class="card" href="${r.html_url}" target="_blank" rel="noopener">
            <div class="card-header">
              <span class="card-title">${r.name}</span>
              ${isPinned ? '<span class="card-pin">PIN</span>' : ''}
              ${r.fork ? '<span class="fork-badge">Fork</span>' : ''}
            </div>
            ${r.description ? `<p class="card-desc">${r.description}</p>` : ''}
            <div class="card-topics">${topics}</div>
            <div class="card-meta">
              ${langColor ? `<span><span class="lang-dot" style="background:${langColor}"></span>${lang}</span>` : ''}
              <span>⭐ ${r.stargazers_count}</span>
              <span>更新于 ${updatedStr}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    // ── Init ──
    (async () => {
      try {
        allRepos = await fetchRepos();
        // Exclude the blog repo itself
        displayRepos = allRepos.filter(r => r.name !== 'cyk1231.github.io');
        renderCards();
      } catch (err) {
        document.getElementById('cardsContainer').innerHTML =
          '<div class="empty">加载失败，请稍后刷新 · ' + err.message + '</div>';
      }
    })();

    document.getElementById('searchInput').addEventListener('input', renderCards);
    document.getElementById('sortSelect').addEventListener('change', renderCards);
  </script>
</body>
</html>
